<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Reef Sort Store Graphics</title>
<link rel="stylesheet" href="../../style.css">
<style>.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:14px}.g a{display:block;text-align:center;text-decoration:none;color:var(--ink);font-weight:800;font-size:.9rem}.g img{width:100%;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.2);background:#fff}.wide{grid-column:1/-1}</style>
</head>
<body>
<main>
  <div class="card">
    <p class="eyebrow">Reef Sort</p>
    <h1>Store Graphics</h1>
    <p class="muted">Tap an image, then press and hold it and choose <b>Download image</b>. Upload screenshots in number order.</p>
    <div class="g">
      <a href="icon-512.png" download><img src="icon-512.png" alt="">App icon (512×512)</a>
      <a class="wide" href="feature-graphic-1024x500.png" download><img src="feature-graphic-1024x500.png" alt="">Feature graphic (1024×500)</a>
      <a href="1-sort.png" download><img src="1-sort.png" alt="">Screenshot 1</a>
      <a href="2-home.png" download><img src="2-home.png" alt="">Screenshot 2</a>
      <a href="3-win.png" download><img src="3-win.png" alt="">Screenshot 3</a>
      <a href="4-dress.png" download><img src="4-dress.png" alt="">Screenshot 4</a>
      <a href="5-areas.png" download><img src="5-areas.png" alt="">Screenshot 5</a>
      <a href="6-map.png" download><img src="6-map.png" alt="">Screenshot 6</a>
      <a href="7-daily.png" download><img src="7-daily.png" alt="">Screenshot 7</a>
    </div>
  </div>
</main>
</body>
</html>
